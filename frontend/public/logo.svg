<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="vanishly-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6" /> <!-- Blue-500 -->
            <stop offset="50%" stop-color="#8B5CF6" /> <!-- Violet-500 -->
            <stop offset="100%" stop-color="#EC4899" /> <!-- Pink-500 -->
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Main V Shape -->
    <!-- Left Wing -->
    <path d="M120 80 L256 432 L392 80 H310 L256 250 L202 80 H120 Z" 
          fill="url(#vanishly-gradient)" 
          stroke="white" 
          stroke-width="10" 
          stroke-linejoin="round"
          filter="url(#glow)" />
          
    <!-- Inner Highlight for depth -->
    <path d="M150 80 L256 360 L362 80 H330 L256 300 L182 80 H150 Z" 
          fill="white" 
          fill-opacity="0.1" />
</svg>
